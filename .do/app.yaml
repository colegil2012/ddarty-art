name: ddarty-art
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# NO databases: block — the frontend has no DB. Removing it detaches the binding.

services:
  - name: web
    dockerfile_path: web/Dockerfile
    source_dir: /
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

    github:
      repo: colegil2012/ddarty-art
      branch: main
      deploy_on_push: true

    health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 5

    termination:
      drain_seconds: 10
      grace_period_seconds: 20

    envs:
      # Now a REAL cross-origin URL — the frontend calls celtech for data.
      - key: PUBLIC_API_BASE
        value: https://celtech-solutions.tech
        scope: RUN_TIME
      - key: PUBLIC_SITE_SLUG
        value: ddarty
        scope: RUN_TIME
      - key: NODE_ENV
        value: production
        scope: RUN_TIME

# Ingress collapses to a single catch-all — no /api or /actuator split anymore,
# since there's no api component to route to.
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: web

# Keep your domains block if the live spec had one — don't drop it.
